[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "billionaire-atlas"
version = "1.0.0"
description = "Who the world's billionaires are, when they got there, and how long they stay: 5,500 people, 1996-2026."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ayanat Gabdullina" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pycountry>=22.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B905"]  # zip(strict=) needs 3.10+ semantics we do not rely on
